<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Activar cuenta | OPTIMA</title>
  <style>
    :root{font-family:Arial,system-ui,sans-serif;background:#f4f5f8;color:#222}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{width:min(440px,100%);background:white;border:1px solid #dbe0e5;border-radius:16px;padding:32px;box-sizing:border-box;box-shadow:0 8px 30px #0001}
    h1{font-size:24px;margin:5px 0 15px}p{line-height:1.5}label{display:block;margin:17px 0 5px;font-weight:600}
    input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px}
    input{border:1px solid #98a1ae}button{border:0;background:#181c22;color:white;margin-top:20px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.hint{color:#52616f;font-size:14px}.error{color:#a01515}.success{color:#116b39}
  </style>
</head>
<body>
  <main>
    <p class="hint">OPTIMA · Seguridad de cuentas</p>
    <h1>Activar mi cuenta</h1>
    <p id="estado" role="status">Comprobando invitación...</p>
    <form id="form" hidden>
      <label for="password">Crear contraseña</label>
      <input type="password" id="password" autocomplete="new-password" minlength="12" maxlength="128" required/>
      <label for="confirmar">Repetir contraseña</label>
      <input type="password" id="confirmar" autocomplete="new-password" minlength="12" maxlength="128" required/>
      <p class="hint">Entre 12 y 128 caracteres, con letras y números.</p>
      <button id="enviar" type="submit">Activar cuenta</button>
    </form>
    <p><a href="/">Volver a OPTIMA</a></p>
  </main>
  <script>
    (()=>{
      const params=new URLSearchParams(location.hash.slice(1));
      const token=params.get('token')||'';
      history.replaceState(null,'',location.pathname);
      const form=document.getElementById('form');
      const estado=document.getElementById('estado');
      const enviar=document.getElementById('enviar');
      const mensaje=(texto,clase='')=>{estado.textContent=texto;estado.className=clase};
      if(!/^[A-Za-z0-9_-]{43}$/.test(token)){mensaje('El enlace no es válido. Solicitá una nueva invitación.','error');return}
      const solicitar=async(ruta,cuerpo)=>{
        const res=await fetch(ruta,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(cuerpo)});
        const datos=await res.json();if(!res.ok||!datos.ok)throw new Error(datos.error||'No se pudo completar la operación');return datos;
      };
      void solicitar('/api/usuarios/validar-invitacion',{token})
        .then(datos=>{mensaje('Hola '+datos.usuario+'. Elegí tu contraseña.');form.hidden=false})
        .catch(err=>mensaje(err.message,'error'));
      form.addEventListener('submit',async(e)=>{
        e.preventDefault();const password=document.getElementById('password').value;
        if(password!==document.getElementById('confirmar').value){mensaje('Las contraseñas no coinciden.','error');return}
        if(!/^(?=.*[A-Za-z])(?=.*\d).{12,128}$/.test(password)){mensaje('La contraseña debe tener letras y números, y al menos 12 caracteres.','error');return}
        enviar.disabled=true;
        try{const d=await solicitar('/api/usuarios/activar',{token,password});mensaje(d.mensaje||'Cuenta activada.','success');form.hidden=true}
        catch(err){mensaje(err.message,'error');enviar.disabled=false}
      });
    })();
  </script>
</body>
</html>
